services:
  db:
    image: postgres:17-alpine
    # Local development credentials only; override POSTGRES_PASSWORD outside your machine.
    environment:
      POSTGRES_DB: nhunguyetspa
      POSTGRES_USER: spa
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-spa_dev_password}
    ports:
      - '5432:5432'
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U spa -d nhunguyetspa']
      interval: 5s
      timeout: 3s
      retries: 10
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - '5000:8080'
    # Same secrets as `dotnet run` (JWT_KEY, MAIL_SETTINGS_*…). Values under `environment` win over this file,
    # so CONNECTION_STRING below still points at the db container.
    env_file:
      - path: backend/src/API/.env
        required: false
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      Cors__AllowedOrigins__0: http://localhost:8080
      CONNECTION_STRING: Host=db;Port=5432;Database=nhunguyetspa;Username=spa;Password=${POSTGRES_PASSWORD:-spa_dev_password}
    depends_on:
      db:
        condition: service_healthy
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:5000}
    ports:
      - '8080:80'
    depends_on:
      - api

volumes:
  db-data:
